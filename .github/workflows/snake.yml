name: Generate Snake Contribution Grid

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate-github-user-contribution-grid-snake-svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00D2FF&color_dots=#ebf8ff,#93C5FD,#3B82F6,#1D4ED8,#1E3A8A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00D2FF&color_dots=#161b22,#1E3A8A,#2563EB,#3B82F6,#60A5FA

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
